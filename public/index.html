<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <script>
    (function(){var t=localStorage.getItem('portfolio_theme');document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');})();
  </script>

  <!-- favicon -->
  <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
  <link rel="alternate icon" href="%PUBLIC_URL%/favicon.ico" />

  <!-- meta -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f2f0eb" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141414" />
  <meta name="description" content="Aman Shrivastava — I scope, build, ship, automate, and maintain things for the web. Developer, product manager, writer." />
  <meta name="author" content="Aman Shrivastava" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Aman Shrivastava — developer, builder, writer" />
  <meta property="og:description" content="I scope, build, ship, automate, and maintain things for the web. Then I write about it." />
  <meta property="og:url" content="https://amanshrivastava.dev" />
  <!-- TODO: add og:image once you have a social preview image -->

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@Aman_eth1" />
  <meta name="twitter:title" content="Aman Shrivastava — developer, builder, writer" />
  <meta name="twitter:description" content="I scope, build, ship, automate, and maintain things for the web. Then I write about it." />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <title>Aman Shrivastava — developer, builder, writer</title>
</head>
